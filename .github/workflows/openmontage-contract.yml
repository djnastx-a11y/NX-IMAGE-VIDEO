name: NX Studio OpenMontage contract

on:
  pull_request:
    paths:
      - 'integrations/openmontage/**'
      - 'docs/OPENMONTAGE_ENGINE.md'
      - '.gitignore'
      - '.github/workflows/openmontage-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check integrations/openmontage/engine.mjs
          node --check integrations/openmontage/engine.test.mjs
      - name: Offline contract tests, no model API and no installer execution
        run: node --test integrations/openmontage/engine.test.mjs
      - name: Print doctor, no network or secrets
        run: node integrations/openmontage/engine.mjs --doctor
